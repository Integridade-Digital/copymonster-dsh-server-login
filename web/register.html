<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro — CopyMonster</title>
    <link rel="icon" href="/logo.svg" />
    <link rel="stylesheet" href="/design.css" />
  </head>
  <body class="auth-bg">
    <div class="auth-card">
      <div class="auth-brand">
        <img class="logo" src="/logo.svg" alt="CopyMonster" />
        <span class="wordmark">CopyMonster</span>
      </div>
      <p class="auth-sub">Cadastro sujeito à aprovação do admin</p>

      <form id="register">
        <div class="field">
          <label for="username">Usuário (3–32 caracteres: letras, números, _ ou -)</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Senha (mín. 8 caracteres)</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required />
        </div>
        <button class="btn primary" type="submit">Cadastrar</button>
        <p class="msg" id="msg"></p>
      </form>

      <p class="auth-alt">Já tem conta? <a href="/login.html">Entrar</a></p>
    </div>

    <script>
      const form = document.getElementById('register')
      const msg = document.getElementById('msg')
      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        msg.textContent = ''
        msg.className = 'msg err'
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ username: form.username.value, password: form.password.value }),
        })
        const body = await res.json().catch(() => ({}))
        if (!res.ok) {
          msg.textContent = body.error === 'username_taken' ? 'Usuário já existe' : body.message || 'Cadastro falhou'
          return
        }
        msg.className = 'msg ok'
        msg.textContent = 'Cadastro realizado! Aguarde aprovação do admin.'
        form.reset()
      })
    </script>
  </body>
</html>
