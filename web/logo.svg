<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <title>CopyMonster</title>
  <!-- CopyMonster logo: stylized CM monogram with copy/paper theme -->
  <defs>
    <linearGradient id="cmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#967d45"/>
      <stop offset="100%" stop-color="#d8ae5f"/>
    </linearGradient>
    <linearGradient id="cmGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#836d3b"/>
      <stop offset="100%" stop-color="#b8944f"/>
    </linearGradient>
  </defs>
  <!-- Document/Copy icon background -->
  <path fill="url(#cmGold)" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm0 16H5V5h11.17L19 7.83v11.17z"/>
  <!-- CM Monogram -->
  <text x="12" y="16.5" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle" font-style="italic">CM</text>
  <!-- Copy indicator (small copy icon at bottom right) -->
  <g opacity="0.9" transform="translate(14, 14) scale(0.6)">
    <path fill="white" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H8V5h10v14z"/>
  </g>
</svg>