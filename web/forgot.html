<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot Password — CopyMonster</title>
    <link rel="icon" href="/logo.svg" />
    <link rel="stylesheet" href="/design.css" />
  </head>
  <body class="auth-bg">
    <div class="auth-card">
      <div class="auth-brand">
        <img class="logo" src="/logo.svg" alt="CopyMonster" />
        <span class="wordmark">CopyMonster</span>
      </div>
      <p class="auth-sub">Reset your password</p>

      <form id="forgot">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <button class="btn primary" type="submit">Send reset link</button>
        <p class="msg" id="msg"></p>
      </form>

      <p class="auth-alt"><a href="/login.html">Back to login</a></p>
    </div>

    <script>
      const form = document.getElementById('forgot')
      const msg = document.getElementById('msg')
      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        msg.textContent = ''
        msg.className = 'msg err'
        const res = await fetch('/api/auth/forgot', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: form.email.value }),
        })
        const body = await res.json().catch(() => ({}))
        if (!res.ok) {
          msg.textContent = body.error === 'not_found' ? 'No account with that email' : body.message || 'Request failed'
          return
        }
        msg.className = 'msg ok'
        msg.textContent = 'If an account exists, a password reset link has been sent.'
        form.reset()
      })
    </script>
  </body>
</html>
