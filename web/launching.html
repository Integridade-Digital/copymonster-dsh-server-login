<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preparando seu ambiente — CopyMonster</title>
  <link rel="icon" href="/brand.png" />
  <style>
    :root {
      --bg: #262624;
      --card-bg: #30302e;
      --card-border: #3a3a37;
      --card-border-highlight: #967d45;
      --primary: #967d45;
      --primary-light: #d0a56b;
      --text: #faf9f5;
      --text-muted: #b7b5a9;
      --success: #10B981;
      --steps-bg: #262624;
      --steps-border: #3a3a37;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #faf9f5;
        --card-bg: #ffffff;
        --card-border: #dad9d4;
        --card-border-highlight: #967d45;
        --primary: #967d45;
        --primary-light: #d0a56b;
        --text: #1c1b18;
        --text-muted: #73726c;
        --success: #10B981;
        --steps-bg: #f5f4ef;
        --steps-border: #dad9d4;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 50% 15%, rgba(150, 125, 69, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 85%, rgba(150, 125, 69, 0.06) 0%, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(150, 125, 69, 0.18);
      text-align: center;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .launch-logo {
      max-width: 160px;
      height: auto;
      display: block;
      margin: 0 auto 24px;
      filter: brightness(0) invert(1);
    }

    @media (prefers-color-scheme: light) {
      .launch-logo {
        filter: none;
      }
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--text);
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .spinner-wrap {
      margin: 24px 0;
      display: flex;
      justify-content: center;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(150, 125, 69, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
      background: var(--steps-bg);
      border: 1px solid var(--steps-border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .step-item.active {
      color: var(--text);
      font-weight: 500;
    }

    .step-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      border: 1.5px solid var(--text-muted);
      flex-shrink: 0;
    }

    .step-item.done .step-icon {
      border-color: var(--success);
      background: var(--success);
      color: #ffffff;
    }

    .step-item.active .step-icon {
      border-color: var(--primary);
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }

    .footer-note {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 24px;
      opacity: 0.8;
    }

    .launch-error {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 10px;
      color: var(--text);
      background: rgba(239, 68, 68, 0.08);
      font-size: 13px;
      line-height: 1.5;
      text-align: left;
    }

    .launch-error button {
      margin-top: 12px;
      padding: 8px 12px;
      border: 1px solid var(--card-border-highlight);
      border-radius: 8px;
      color: var(--text);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/brand.png" alt="CopyMonster" class="launch-logo" />

    <h1>Preparando seu ambiente CopyMonster...</h1>
    <p class="subtitle">Configurando seu workspace isolado e carregando o motor de Brand DNA.</p>

    <div class="spinner-wrap">
      <div class="spinner"></div>
    </div>

    <div class="steps">
      <div class="step-item done" id="step-1">
        <div class="step-icon">✓</div>
        <span>Sessão segura autenticada</span>
      </div>
      <div class="step-item active" id="step-2">
        <div class="step-icon"></div>
        <span>Alocando workspace dedicado e portas seguras...</span>
      </div>
      <div class="step-item" id="step-3">
        <div class="step-icon"></div>
        <span>Carregando o motor CopyMonster e seus plugins...</span>
      </div>
    </div>

    <p class="footer-note">Isolamento total ativo • Ambiente dedicado • CopyMonster SaaS</p>
    <div class="launch-error" id="launch-error" role="alert" aria-live="assertive">
      <div id="launch-error-message"></div>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </div>
  </div>

  <script>
    let pollCount = 0;
    let polling = false;
    let reloadScheduled = false;
    let consecutiveFailures = 0;
    const maxWaitMs = 120000;
    const requestTimeoutMs = 5000;
    const startedAt = Date.now();

    function showFailure(message) {
      document.querySelector('.spinner-wrap').style.display = 'none';
      document.getElementById('step-3').className = 'step-item';
      document.getElementById('launch-error-message').textContent = message;
      document.getElementById('launch-error').style.display = 'block';
    }

    async function checkStatus() {
      if (polling || reloadScheduled) return;
      polling = true;
      pollCount++;
      let failureMessage = '';
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), requestTimeoutMs);
        let res;
        let data;
        try {
          res = await fetch('/api/dsh/status', {
            credentials: 'include',
            cache: 'no-store',
            signal: controller.signal,
          });
          if (res.ok) data = await res.json();
        } finally {
          clearTimeout(timeout);
        }
        if (res.status === 401 || res.status === 403) {
          showFailure('Sua sessão expirou ou perdeu autorização. Entre novamente e abra o CopyMonster.');
          return;
        }
        if (!res.ok) {
          failureMessage = `O serviço de inicialização respondeu HTTP ${res.status}.`;
        } else {
          consecutiveFailures = 0;
          if (data && data.running) {
            document.getElementById('step-2').className = 'step-item done';
            document.getElementById('step-2').querySelector('.step-icon').textContent = '✓';
            document.getElementById('step-3').className = 'step-item done';
            document.getElementById('step-3').querySelector('.step-icon').textContent = '✓';
            reloadScheduled = true;
            setTimeout(() => window.location.reload(), 600);
            return;
          }
          if (data && data.status === 'crashed') {
            const detail = data.instance && data.instance.lastError ? ` Detalhe: ${data.instance.lastError}` : '';
            showFailure(`O processo do CopyMonster encerrou durante a inicialização.${detail}`);
            return;
          }
          if (data && data.status === 'stopped') {
            failureMessage = 'O processo do CopyMonster não está ativo. Tente novamente para iniciar o ambiente.';
          }
        }
      } catch (error) {
        failureMessage = error && error.name === 'AbortError'
          ? 'A verificação do servidor demorou mais de 5 segundos.'
          : 'Não foi possível consultar o status do ambiente.';
      } finally {
        polling = false;
      }

      if (failureMessage) consecutiveFailures++;
      if (consecutiveFailures >= 3) {
        showFailure(`${failureMessage} O servidor não conseguiu confirmar o estado do tenant após 3 tentativas. A tela parou para evitar um loop; verifique os logs do serviço e tente novamente depois.`);
        return;
      }

      if (Date.now() - startedAt >= maxWaitMs) {
        showFailure(`${failureMessage || 'O ambiente não ficou pronto dentro do tempo esperado.'} A inicialização foi interrompida nesta tela para evitar um loop. Verifique os logs do serviço de tenants antes de tentar novamente.`);
        return;
      }

      if (pollCount > 10) {
        document.getElementById('step-2').className = 'step-item done';
        document.getElementById('step-2').querySelector('.step-icon').textContent = '✓';
        document.getElementById('step-3').className = 'step-item active';
      }
      setTimeout(checkStatus, failureMessage ? 2500 : 1500);
    }

    setTimeout(checkStatus, 1200);
  </script>
</body>
</html>
