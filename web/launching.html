<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciando Ambiente Seguro — CopyMonster</title>
  <style>
    :root {
      --bg: #0A0A0C;
      --card-bg: rgba(18, 18, 24, 0.75);
      --card-border: rgba(212, 175, 55, 0.25);
      --gold-primary: #D4AF37;
      --gold-light: #F2D06B;
      --gold-dark: #997D26;
      --text: #F4F4F6;
      --text-muted: #8E8E9A;
      --success: #10B981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 85%, rgba(212, 175, 55, 0.04) 0%, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 80px rgba(212, 175, 55, 0.05);
      backdrop-filter: blur(12px);
      text-align: center;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(242, 208, 107, 0.15), rgba(153, 125, 38, 0.05));
      border: 1px solid var(--card-border);
      margin-bottom: 24px;
      box-shadow: 0 0 24px rgba(212, 175, 55, 0.15);
    }

    .brand-logo svg {
      width: 32px;
      height: 32px;
      fill: var(--gold-light);
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #FFFFFF 40%, var(--gold-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .spinner-wrap {
      margin: 24px 0;
      display: flex;
      justify-content: center;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(212, 175, 55, 0.15);
      border-top-color: var(--gold-primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
      background: rgba(10, 10, 12, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .step-item.active {
      color: var(--text);
      font-weight: 500;
    }

    .step-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      border: 1.5px solid var(--text-muted);
      flex-shrink: 0;
    }

    .step-item.done .step-icon {
      border-color: var(--success);
      background: var(--success);
      color: #000;
    }

    .step-item.active .step-icon {
      border-color: var(--gold-primary);
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }

    .footer-note {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 24px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>

    <h1>Iniciando seu ambiente seguro CopyMonster...</h1>
    <p class="subtitle">Preparando seu workspace Linux isolado e carregando seu motor Brand DNA.</p>

    <div class="spinner-wrap">
      <div class="spinner"></div>
    </div>

    <div class="steps">
      <div class="step-item done" id="step-1">
        <div class="step-icon">✓</div>
        <span>Sessão Supabase SSO autenticada</span>
      </div>
      <div class="step-item active" id="step-2">
        <div class="step-icon"></div>
        <span>Alocando sandbox Linux e portas seguras...</span>
      </div>
      <div class="step-item" id="step-3">
        <div class="step-icon"></div>
        <span>Carregando motor CopyMonster e plugins...</span>
      </div>
    </div>

    <p class="footer-note">Hard Isolation Ativo • UID Dedicado • CopyMonster SaaS</p>
  </div>

  <script>
    let pollCount = 0;
    const maxPolls = 60;

    async function checkStatus() {
      pollCount++;
      try {
        const res = await fetch('/api/dsh/status', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.running) {
            document.getElementById('step-2').className = 'step-item done';
            document.getElementById('step-2').querySelector('.step-icon').textContent = '✓';
            document.getElementById('step-3').className = 'step-item done';
            document.getElementById('step-3').querySelector('.step-icon').textContent = '✓';
            
            // Redirect or reload into the active DSH session
            setTimeout(() => {
              window.location.reload();
            }, 600);
            return;
          }
        }
      } catch (e) {
        // Retry silently
      }

      if (pollCount > 10) {
        document.getElementById('step-2').className = 'step-item done';
        document.getElementById('step-2').querySelector('.step-icon').textContent = '✓';
        document.getElementById('step-3').className = 'step-item active';
      }

      if (pollCount < maxPolls) {
        setTimeout(checkStatus, 1500);
      } else {
        window.location.reload();
      }
    }

    setTimeout(checkStatus, 1200);
  </script>
</body>
</html>
