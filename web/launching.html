<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preparando seu ambiente — CopyMonster</title>
  <link rel="icon" href="/logo.svg" />
  <style>
    :root {
      --bg: #262624;
      --card-bg: #30302e;
      --card-border: #3a3a37;
      --card-border-highlight: #967d45;
      --primary: #967d45;
      --primary-light: #d0a56b;
      --text: #faf9f5;
      --text-muted: #b7b5a9;
      --success: #10B981;
      --steps-bg: #262624;
      --steps-border: #3a3a37;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #faf9f5;
        --card-bg: #ffffff;
        --card-border: #dad9d4;
        --card-border-highlight: #967d45;
        --primary: #967d45;
        --primary-light: #d0a56b;
        --text: #1c1b18;
        --text-muted: #73726c;
        --success: #10B981;
        --steps-bg: #f5f4ef;
        --steps-border: #dad9d4;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 50% 15%, rgba(150, 125, 69, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 85%, rgba(150, 125, 69, 0.06) 0%, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(150, 125, 69, 0.18);
      text-align: center;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .launch-logo {
      max-width: 160px;
      height: auto;
      display: block;
      margin: 0 auto 24px;
      filter: brightness(0) invert(1);
    }

    @media (prefers-color-scheme: light) {
      .launch-logo {
        filter: none;
      }
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--text);
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .spinner-wrap {
      margin: 24px 0;
      display: flex;
      justify-content: center;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(150, 125, 69, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
      background: var(--steps-bg);
      border: 1px solid var(--steps-border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .step-item.active {
      color: var(--text);
      font-weight: 500;
    }

    .step-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      border: 1.5px solid var(--text-muted);
      flex-shrink: 0;
    }

    .step-item.done .step-icon {
      border-color: var(--success);
      background: var(--success);
      color: #ffffff;
    }

    .step-item.active .step-icon {
      border-color: var(--primary);
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }

    .footer-note {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 24px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo.svg" alt="CopyMonster" class="launch-logo" />

    <h1>Preparando seu ambiente CopyMonster...</h1>
    <p class="subtitle">Configurando seu workspace isolado e carregando o motor de Brand DNA.</p>

    <div class="spinner-wrap">
      <div class="spinner"></div>
    </div>

    <div class="steps">
      <div class="step-item done" id="step-1">
        <div class="step-icon">✓</div>
        <span>Sessão segura autenticada</span>
      </div>
      <div class="step-item active" id="step-2">
        <div class="step-icon"></div>
        <span>Alocando workspace dedicado e portas seguras...</span>
      </div>
      <div class="step-item" id="step-3">
        <div class="step-icon"></div>
        <span>Carregando o motor CopyMonster e seus plugins...</span>
      </div>
    </div>

    <p class="footer-note">Isolamento total ativo • Ambiente dedicado • CopyMonster SaaS</p>
  </div>

  <script>
    let pollCount = 0;
    const maxPolls = 60;

    async function checkStatus() {
      pollCount++;
      try {
        const res = await fetch('/api/dsh/status', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.running) {
            document.getElementById('step-2').className = 'step-item done';
            document.getElementById('step-2').querySelector('.step-icon').textContent = '✓';
            document.getElementById('step-3').className = 'step-item done';
            document.getElementById('step-3').querySelector('.step-icon').textContent = '✓';

            // Redirect or reload into the active DSH session
            setTimeout(() => {
              window.location.reload();
            }, 600);
            return;
          }
        }
      } catch (e) {
        // Retry silently
      }

      if (pollCount > 10) {
        document.getElementById('step-2').className = 'step-item done';
        document.getElementById('step-2').querySelector('.step-icon').textContent = '✓';
        document.getElementById('step-3').className = 'step-item active';
      }

      if (pollCount < maxPolls) {
        setTimeout(checkStatus, 1500);
      } else {
        window.location.reload();
      }
    }

    setTimeout(checkStatus, 1200);
  </script>
</body>
</html>
