<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — CopyMonster</title>
    <link rel="icon" href="/logo.svg" />
    <link rel="stylesheet" href="/design.css" />
  </head>
  <body class="auth-bg">
    <div class="auth-card">
      <div class="auth-brand">
        <img class="logo" src="/logo.svg" alt="CopyMonster" />
        <span class="wordmark">CopyMonster</span>
      </div>
      <p class="auth-sub">Access your CopyMonster workspace</p>

      <form id="login">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn primary" type="submit">Login</button>
        <p class="msg" id="msg"></p>
      </form>

      <p class="auth-alt">Don't have an account? <a href="/register.html">Register</a></p>
      <p class="auth-alt"><a href="/forgot.html">Forgot password?</a></p>
    </div>

    <script>
      const form = document.getElementById('login')
      const msg = document.getElementById('msg')
      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        msg.textContent = ''
        msg.className = 'msg err'
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ username: form.username.value, password: form.password.value }),
        })
        if (!res.ok) {
          const body = await res.json().catch(() => ({}))
          msg.textContent =
            body.error === 'disabled' ? 'Account disabled'
            : 'Invalid username or password'
          return
        }
        location.href = '/desktop.html'
      })
    </script>
  </body>
</html>
